name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.13"
      - name: Setup
        run: ./dev setup
      - name: Check
        run: ./dev check
      - name: Verify
        run: ./dev verify
